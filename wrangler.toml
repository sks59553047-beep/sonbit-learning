# Cloudflare Pages 설정(사이트를 올릴 때 /tmp 로 복사해서 함께 쓴다 — 메모의 「배포」 참고).
# 데이터베이스(게시판 글)를 함수에서 env.DB 로 쓰게 연결한다.
# 비밀값(GITHUB_TOKEN, ADMIN_PASSWORD, BOARD_SALT)은 여기 쓰지 않고 `wrangler pages secret put` 으로만 넣는다.
name = "sonbit"
pages_build_output_dir = "./sonbit-dist"
compatibility_date = "2026-11-01"

[[d1_databases]]
binding = "DB"
database_name = "sonbit-board"
database_id = "00a5bc6d-8149-466f-a8b8-41e69d35f310"
